# Assembler Service — assembles WS vault fragments into typed record messages

services:
  assembler:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: assembler

    environment:
      QUEUE_URL: ${QUEUE_URL}

      ASSEMBLER_PREFETCH: ${ASSEMBLER_PREFETCH:-200}

      NODE_ENV:  ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
