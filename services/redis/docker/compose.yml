# Redis Service - In-Memory Cache
# Provides fast, ephemeral storage and caching. Can be shared across services/modules.

services:
  redis:
    image: redis:7.4-alpine

    environment:
      TZ: ${TZ:-UTC}
      # Required: an empty password would turn authentication off. The
      # healthcheck reads it from here, which keeps it out of its command line.
      CACHE_PASS: ${CACHE_PASS:?CACHE_PASS is required}

    ports:
      - "${CACHE_BIND:-127.0.0.1}:${CACHE_PORT:-}:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes --requirepass "${CACHE_PASS:?CACHE_PASS is required}"

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$CACHE_PASS\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  redis-data:
