# Redis Service - In-Memory Cache
# Provides fast, ephemeral storage and caching. Can be shared across services/modules.

services:
  redis:
    image: redis:7-alpine

    environment:
      TZ: ${TZ:-UTC}
      CACHE_PASS: ${CACHE_PASS}

    ports:
      - "${CACHE_PORT:-}:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes --requirepass "${CACHE_PASS}"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CACHE_PASS}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  redis-data:
