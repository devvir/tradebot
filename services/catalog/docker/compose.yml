# Catalog Service — the public API over what prospector has catalogued.
#
# Opens the catalog.db prospector writes, read-only: CATALOG_DIR on the host
# (default: ${DATA_DIR}/catalog; compose refuses to start it while neither is
# set) is mounted at the same fixed path. It writes nothing; every write it is sent —
# lenses, and reports of what was downloaded — is forwarded to prospector's
# private API. Prospector owns the database: it stores lenses and keeps what
# each lets through (`lens_member`) current (docs/services/PROSPECTOR.md).
#
# It creates nothing: on a fresh deployment it waits for prospector to build the
# database.

services:
  catalog:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: catalog

    container_name: catalog

    environment:
      # The shared secret every request must carry in `x-catalog-token`; the same
      # one prospector checks, and sent on to it with every forwarded write.
      #
      # Empty is allowed and means the check is off — every request is let
      # through, which is what makes the read endpoints answerable from a browser
      # with no header to set. The service warns loudly on startup, so an open
      # catalog is a decision somebody took rather than one nobody noticed.
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ${CATALOG_DIR:-${DATA_DIR:?DATA_DIR is not defined}/catalog}:/data/catalog

    ports:
      # The catalog API, on CATALOG_PORT or, left empty, a free port docker
      # picks. Either way it is published, on 127.0.0.1 unless CATALOG_BIND
      # names another address; containers on the shared network reach it as
      # catalog:8080 regardless.
      - "${CATALOG_BIND:-127.0.0.1}:${CATALOG_PORT:-}:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
