# Journalist Service - BitMEX WebSocket live data recorder

services:
  journalist:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: journalist

    environment:
      QUEUE_URL:  ${QUEUE_URL}
      VAULT_URL:  ${VAULT_URL}

      JOURNALIST_SUFFIX: ${JOURNALIST_SUFFIX:-}

      NODE_ENV:  ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
