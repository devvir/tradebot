# Writer Service - Consumes from topic exchange and persists to MongoDB
# Generic, reusable service. Deduplicates and archives data.
# Supports horizontal scaling: Multiple instances automatically load-balance message consumption.

services:
  writer:
    scale: ${WRITER_REPLICAS:-1}

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: writer

    environment:
      # Dependencies (queue and database)
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:root@mongodb:27017?authSource=admin}

      # Data flow
      WRITER_DB_ARCHIVE: ${WRITER_DB_ARCHIVE:-tradebot_archive}
      WRITER_DB_COLLECT: ${WRITER_DB_COLLECT:-tradebot_collect}
      WRITER_PREFETCH: ${WRITER_PREFETCH:-1000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${WRITER_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: ${WRITER_RESTART_POLICY:-unless-stopped}
