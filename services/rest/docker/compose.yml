# Rest Service - BitMEX-compatible HTTP Rest API server

services:
  rest:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: rest

    environment:
      # URL to the Snapshots HTTP server
      SNAPSHOTS_URL: ${SNAPSHOTS_URL:-}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${REST_HTTP_PORT:-}:3001"
      - "${REST_HEALTH_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: ${REST_RESTART_POLICY:-unless-stopped}
