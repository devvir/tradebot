# Rest Service — BitMEX-compatible HTTP REST API facade
# Forwards all requests (including api-key header) to the configured data backend (proxy or digger)

services:
  rest:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: rest

    environment:
      REST_DATA_URL: ${REST_DATA_URL:-}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    ports:
      - "${REST_PORT:-}:80"
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped
