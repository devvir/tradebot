# Distiller Service — reads raw BitMEX data from MongoDB and writes derived collections

services:
  distiller:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: distiller

    environment:
      DB_URL:      ${DB_URL}
      DB_DATABASE: ${DB_DATABASE:-tradebot}

      DISTILLER_GENERATORS: ${DISTILLER_GENERATORS:-}

      NODE_ENV:  ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
