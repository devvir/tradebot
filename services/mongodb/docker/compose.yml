# MongoDB Service - Data Persistence
# Provides persistent storage. Can be shared across services/modules.
#
# Cache Size:
# By default, MongoDB's WiredTiger allocates 50% of available system memory as cache.
# This is automatically capped here to prevent OOM kills on memory-constrained systems.
# For ~4GB of data, 2GB cache is optimal. Adjust MONGODB_CACHE_SIZE_GB if needed.

services:
  mongodb:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-tradebot}-mongodb
    command: mongod --quiet --setParameter logLevel=0 --wiredTigerCacheSizeGB=${MONGODB_CACHE_SIZE_GB:-2}

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS:-root}
      TZ: ${TZ:-UTC}

    ports:
      - "${MONGODB_PORT:-}:27017"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: ${MONGODB_RESTART_POLICY:-unless-stopped}

volumes:
  mongodb-data:
  mongodb-config:
