# Clerk Service — reads closed vault files and routes rows to the customs exchange

services:
  clerk:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: clerk

    environment:
      CACHE_URL:  ${CACHE_URL}
      CACHE_PASS: ${CACHE_PASS}
      QUEUE_URL:  ${QUEUE_URL}
      VAULT_URL:  ${VAULT_URL}

      CLERK_BACKPRESSURE_LIMIT: ${CLERK_BACKPRESSURE_LIMIT:-100000}
      CLERK_WATCH_QUEUES:       ${CLERK_WATCH_QUEUES:-assembler,registrar}

      NODE_ENV:  ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
