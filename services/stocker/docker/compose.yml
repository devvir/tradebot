# Stocker Service — turns every collector's raw files into the Parquet vault.
#
# Two mounts. The archives come in **read-only**: they are hauler's, and the
# mount enforces that rather than trusting the code. The vault is the volume
# stocker owns, and where it keeps everything transient.
#
# What exists, and whether it is all downloaded, is asked of the catalog over
# the shared network — through a lens, where one is set.
#
# Pre-create the vault for uid 1000:
#   sudo mkdir -p /storage/tradebot/vault && sudo chown 1000:1000 /storage/tradebot/vault

services:
  stocker:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: stocker

        # A build input, not a setting: nothing in stocker reads it or adapts to
        # it. Concurrency is what decides the appetite — each build holds a
        # month-sized sort — and this is only the ceiling the box will tolerate
        # alongside the collectors.
        NODE_MEMORY_MB: ${STOCKER_MEMORY_MB:-4096}

    container_name: stocker

    environment:
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # The lens the catalog is read through. Empty reads the whole catalog,
      # where most partitions are owed files and simply wait.
      STOCKER_LENS: ${STOCKER_LENS:-}

      # Which venues and tables to stock (default: everything mapped)
      STOCKER_VENUES:  ${STOCKER_VENUES:-}
      STOCKER_TABLES:  ${STOCKER_TABLES:-}

      # Symbol tokens, case-insensitive substrings. Empty means every symbol. A
      # partition stocked through a filter carries it in its version, so it never
      # passes for a whole one.
      STOCKER_SYMBOLS: ${STOCKER_SYMBOLS:-}

      # Inclusive month bounds, YYYY-MM. They filter what a sweep considers and
      # nothing is written down about them.
      STOCKER_START_MONTH: ${STOCKER_START_MONTH:-}
      STOCKER_END_MONTH:   ${STOCKER_END_MONTH:-}

      # Builds run at once, one instrument each. Each holds a month-sized sort.
      STOCKER_CONCURRENCY: ${STOCKER_CONCURRENCY:-2}

      # Minutes between sweeps
      STOCKER_SCAN_MINUTES: ${STOCKER_SCAN_MINUTES:-30}

      # Cores a build may take. DuckDB spills to disk inside the vault volume
      # rather than being killed; this host runs the collectors at the same time.
      STOCKER_THREADS: ${STOCKER_THREADS:-4}

      # No partition is started below this much free space on the vault volume.
      STOCKER_MIN_FREE_GB: ${STOCKER_MIN_FREE_GB:-20}
      STOCKER_MEMORY_GB:  ${STOCKER_MEMORY_GB:-4}
      STOCKER_SPLIT_GB:   ${STOCKER_SPLIT_GB:-1}
      STOCKER_COOL_HOURS: ${STOCKER_COOL_HOURS:-1}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ${STOCKER_ARCHIVES_DIR:?STOCKER_ARCHIVES_DIR is not defined}:/data/archives:ro
      - ${STOCKER_VAULT_DIR:?STOCKER_VAULT_DIR is not defined}:/data/vault

    ports:
      - :3000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
