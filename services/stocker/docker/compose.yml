# Stocker Service — turns the archives into the Parquet vault.
#
# Two mounts. The archives come in **read-only**: they are hauler's, and the
# mount enforces that rather than trusting the code. The vault is the volume
# stocker owns, and where it keeps everything transient.
#
# What exists, and whether it is all downloaded, is asked of the catalog over
# the shared network — through a lens, where one is set.
#
# The host paths are DATA_ARCHIVES_DIR and DATA_VAULT_DIR, by default
# ${DATA_DIR}/archives and ${DATA_DIR}/vault; compose refuses to start it while
# DATA_DIR is unset and either of the two is too.
#
# Pre-create the vault for uid 1000:
#   dir="${DATA_VAULT_DIR:-$DATA_DIR/vault}"
#   sudo mkdir -p "$dir" && sudo chown 1000:1000 "$dir"

services:
  stocker:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: stocker

        # The node heap. The service holds listings and small archives in it and
        # nothing that grows with a month's size: the sort is the query engine's,
        # which keeps its own memory — see STOCKER_ENGINE_MEMORY_GB.
        NODE_MEMORY_MB: 4096

        # Installed into the prod image: xlsx series are read with DuckDB's excel
        # extension, which stocker would otherwise fetch from DuckDB's extension
        # repository the first time a run reads one.
        DUCKDB_EXTENSIONS: excel

    container_name: stocker

    environment:
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # The lens the catalog is read through. Empty reads the whole catalog,
      # where most partitions are owed files and simply wait.
      STOCKER_LENS: ${STOCKER_LENS:-}

      # Which venues to stock (default: everything mapped)
      STOCKER_VENUES:  ${STOCKER_VENUES:-}

      # DuckDB connections, one pool shared by partitions: as many light
      # partitions built side by side, or one heavy partition's instruments.
      # Each holds a month-sized sort.
      STOCKER_CONCURRENCY: ${STOCKER_CONCURRENCY:-2}

      # Cores the query engine may take, shared by every build. DuckDB spills to
      # disk inside the vault volume rather than being killed; this host runs the
      # collectors at the same time.
      STOCKER_THREADS: ${STOCKER_THREADS:-4}

      # No partition is started below this much free space on the vault volume.
      STOCKER_MIN_FREE_GB: ${STOCKER_MIN_FREE_GB:-20}
      STOCKER_ENGINE_MEMORY_GB: ${STOCKER_ENGINE_MEMORY_GB:-4}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ${DATA_ARCHIVES_DIR:-${DATA_DIR:?DATA_DIR is not defined}/archives}:/data/archives:ro
      - ${DATA_VAULT_DIR:-${DATA_DIR:?DATA_DIR is not defined}/vault}:/data/vault

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
