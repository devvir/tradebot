# RabbitMQ configuration file
# https://www.rabbitmq.com/configure.html

# Logging — to the console, so the broker's log is the container's log
log.console = true

# Access — guest logs in only over loopback, from inside the container; every
# other client uses the QUEUE_USER the broker is created with
loopback_users.guest = true

# Network and Protocol
listeners.tcp.default = 5672
management.listener.port = 15672

# Memory — the broker's total is the container's memory limit, which it would
# not see on its own: it reads the host's RAM. Publishers are blocked once the
# broker uses 0.6 of that total.
total_memory_available_override_value = $(QUEUE_MEM_LIMIT)
vm_memory_high_watermark.relative = 0.6

# TCP buffer sizes — larger buffers reduce syscall overhead for bulk transfers
tcp_listen_options.backlog = 128
tcp_listen_options.sndbuf = 196608
tcp_listen_options.recbuf = 196608

# Heartbeat and connection timeout
heartbeat = 60
