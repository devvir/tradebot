# RabbitMQ base service definition.
# Meant to be extended: each instance sets its own hostname, container_name,
# ports and data volume.

services:
  rabbitmq:
    image: rabbitmq:4.3.8-management-alpine

    environment:
      # Required. The broker creates this user on first start, and guest only
      # ever logs in from inside the container (see rabbitmq.conf).
      RABBITMQ_DEFAULT_USER: ${QUEUE_USER:?QUEUE_USER is required}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_PASS:?QUEUE_PASS is required}
      TZ: ${TZ:-UTC}
      # The container's memory limit (mem_limit below), handed to the broker:
      # rabbitmq.conf takes it as the broker's total memory, which the broker
      # would otherwise read from the host.
      QUEUE_MEM_LIMIT: ${QUEUE_MEM_LIMIT:-2GiB}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Added beside the image's own conf.d/10-defaults.conf, and read after it.
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/90-tradebot.conf:ro
      - ./advanced.config:/etc/rabbitmq/advanced.config:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s

    # The most memory the container may take. The broker reads the same value
    # as its total (QUEUE_MEM_LIMIT above), and blocks publishers at a share of
    # it before this is reached.
    mem_limit: ${QUEUE_MEM_LIMIT:-2GiB}

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped

volumes:
  rabbitmq-data:
