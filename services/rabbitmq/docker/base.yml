# RabbitMQ base service definition.
# Extend this in infra pack composes to create named instances (queue, queue-rt, etc.)

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine

    environment:
      RABBITMQ_DEFAULT_USER: ${QUEUE_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_PASS:-guest}
      TZ: ${TZ:-UTC}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - .:/etc/rabbitmq/conf.d:ro
      - ./advanced.config:/etc/rabbitmq/advanced.config:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  rabbitmq-data:
