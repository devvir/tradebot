# RabbitMQ base service definition.
# Extend this in infra pack composes to create named instances (queue, queue-rt, etc.)

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine

    environment:
      # Required. The broker creates this user on first start, and guest only
      # ever logs in from inside the container (see rabbitmq.conf).
      RABBITMQ_DEFAULT_USER: ${QUEUE_USER:?QUEUE_USER is required}
      RABBITMQ_DEFAULT_PASS: ${QUEUE_PASS:?QUEUE_PASS is required}
      TZ: ${TZ:-UTC}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Added beside the image's own conf.d/10-defaults.conf, and read after it.
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/90-tradebot.conf:ro
      - ./advanced.config:/etc/rabbitmq/advanced.config:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  rabbitmq-data:
