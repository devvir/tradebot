# RabbitMQ Service - Message Queue
# Provides pub/sub queue for all data flow. Can be shared across services/modules.

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.12-management-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-.}-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      TZ: ${TZ:-UTC}

    ports:
      - "${RABBITMQ_AMQP_PORT:-9672}:5672"
      - "${RABBITMQ_MGMT_PORT:-19672}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - .:/etc/rabbitmq/conf.d:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 15s

    restart: ${RABBITMQ_RESTART_POLICY:-unless-stopped}

volumes:
  rabbitmq-data:
