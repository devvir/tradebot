# Broadcast Service - Connects to BitMEX and publishes to queue

services:
  broadcast:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: broadcast

    environment:
      # BitMEX Connection (testnet or live)
      BITMEX_TESTNET: ${BITMEX_TESTNET:-false}

      # Queue
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      BROADCAST_MESSAGE_TTL: ${BROADCAST_MESSAGE_TTL:-1800000}

      # Reconnect delays
      BROADCAST_RECONNECT_DELAY_MS: ${BROADCAST_RECONNECT_DELAY_MS:-5000}
      BROADCAST_MAX_RECONNECT_DELAY_MS: ${BROADCAST_MAX_RECONNECT_DELAY_MS:-60000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${BROADCAST_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: ${BROADCAST_RESTART_POLICY:-unless-stopped}

    deploy:
      replicas: ${BROADCAST_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
