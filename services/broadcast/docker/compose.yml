# Broadcast Service - Connects to BitMEX and publishes to queue

services:
  broadcast:
    scale: ${BROADCAST_REPLICAS:-1}

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: broadcast

    environment:
      # BitMEX Connection (testnet or live)
      BITMEX_TESTNET: ${BITMEX_TESTNET:-false}
      BROADCAST_FEED_PRESET: ${BROADCAST_FEED_PRESET:-none}

      # Queue
      QUEUE_URL: ${QUEUE_URL}

      # Bouncer (authenticated WebSocket connections)
      BOUNCER_URL: ${BOUNCER_URL}
      BOUNCER_TOKEN: ${BOUNCER_TOKEN}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - ${BROADCAST_PORT:-}:8000
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
