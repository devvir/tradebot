services:
  router:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: router

    environment:
      QUEUE_URL: ${QUEUE_URL}
      ROUTER_RULES: ${ROUTER_RULES:-}

      # How many unacknowledged messages the router holds per source queue; at
      # least 1.
      ROUTER_PREFETCH: ${ROUTER_PREFETCH:-500}

      # Backpressure: publishing pauses while any of ROUTER_WATCH_QUEUES (CSV)
      # holds ROUTER_MAX_READY messages or more. 0 turns it off; a positive
      # value needs at least one queue to watch.
      ROUTER_MAX_READY:    ${ROUTER_MAX_READY:-0}
      ROUTER_WATCH_QUEUES: ${ROUTER_WATCH_QUEUES:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}

    user: "1000:1000"

    volumes:
      - ../../../:/live

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped

    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
