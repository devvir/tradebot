services:
  router:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: router

    environment:
      QUEUE_URL: ${QUEUE_URL}
      ROUTER_RULES: ${ROUTER_RULES:-}

      # How many unacknowledged messages the router holds per source queue; at
      # least 1.
      ROUTER_PREFETCH: ${ROUTER_PREFETCH:-500}

      # Backpressure: consuming pauses while any of ROUTER_WATCH_QUEUES (CSV)
      # holds ROUTER_MAX_READY messages or more. A soft limit: messages taken
      # before the pause are still routed. 0 turns it off; a positive value
      # needs at least one queue to watch.
      ROUTER_MAX_READY:    ${ROUTER_MAX_READY:-0}
      ROUTER_WATCH_QUEUES: ${ROUTER_WATCH_QUEUES:-}

      # A message whose routing fails is retried with back-off, and after
      # ROUTER_MAX_ATTEMPTS failures (at least 1) is published to the fanout
      # exchange ROUTER_DEAD_LETTER_EXCHANGE, which the router declares with
      # ROUTER_DEAD_LETTER_QUEUE bound to it. Neither may be part of a rule.
      ROUTER_MAX_ATTEMPTS:         ${ROUTER_MAX_ATTEMPTS:-5}
      ROUTER_DEAD_LETTER_EXCHANGE: ${ROUTER_DEAD_LETTER_EXCHANGE:-router.dead-letter}
      ROUTER_DEAD_LETTER_QUEUE:    ${ROUTER_DEAD_LETTER_QUEUE:-router.dead-letter}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}

    user: "1000:1000"

    # The most memory the container may take, heap and native together: the
    # node heap (NODE_MEMORY_MB, 2048 MB) and a gigabyte beside it for buffers,
    # sockets and the runtime itself. Reaching it gets the container killed.
    mem_limit: ${ROUTER_MEM_LIMIT:-3GiB}

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped

    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
