services:
  router:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: router

    environment:
      QUEUE_URL: ${QUEUE_URL}
      ROUTER_RULES: ${ROUTER_RULES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    restart: unless-stopped

    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
