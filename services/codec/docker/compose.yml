# Codec Service - Stateless transformation service for message encoding/decoding

services:
  codec:
    scale: ${CODEC_REPLICAS:-1}

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: codec

    environment:
      # Dependencies (queue)
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

      # Performance tuning
      CODEC_PREFETCH: ${CODEC_PREFETCH:-1000}
      CODEC_BROTLI_QUALITY: ${CODEC_BROTLI_QUALITY:-1}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${CODEC_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: ${CODEC_RESTART_POLICY:-unless-stopped}
