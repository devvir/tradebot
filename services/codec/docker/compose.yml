# Codec Service - Consumes from bitmex.feed queue, transforms messages, publishes to archivist exchange
# Stateless transformation service for message encoding/decoding and normalization
# Supports scaling: Multiple instances automatically load-balance message consumption from RabbitMQ

services:
  codec:
    container_name: ${MODULE_NAME:-tradebot}-codec
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: codec

    environment:
      # Dependencies (queue)
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

      # Data flow
      CODEC_INBOUND_EXCHANGE: ${CODEC_INBOUND_EXCHANGE:-ex.feed}
      CODEC_INBOUND_QUEUE: ${CODEC_INBOUND_QUEUE:-q.feed}
      CODEC_OUTBOUND_EXCHANGE: ${CODEC_OUTBOUND_EXCHANGE:-ex.archive}
      CODEC_OUTBOUND_QUEUE: ${CODEC_OUTBOUND_QUEUE:-q.archive}

      # Codec Strategy
      CODEC_STRATEGY: ${CODEC_STRATEGY:-}

      # Performance tuning
      CODEC_BROTLI_QUALITY: ${CODEC_BROTLI_QUALITY:-4}
      CODEC_PREFETCH: ${CODEC_PREFETCH:-100}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${CODEC_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: ${CODEC_RESTART_POLICY:-unless-stopped}

    depends_on:
      rabbitmq:
        condition: service_healthy

    deploy:
      replicas: ${CODEC_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
