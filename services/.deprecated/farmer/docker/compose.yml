# Farmer Service — reads closed vault files, reconstructs WS envelopes, and inserts the data into MongoDB

services:
  farmer:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: farmer
        NODE_MEMORY_MB: 4096

    environment:
      DB_URL:        ${DB_URL}
      DB_DATABASE:   ${DB_DATABASE}
      CACHE_URL:     ${CACHE_URL}
      CACHE_PASS:    ${CACHE_PASS}
      VAULT_URL:     ${VAULT_URL}
      LIBRARIAN_URL: ${LIBRARIAN_URL:-}

      FARMER_TABLES:            ${FARMER_TABLES:-}
      FARMER_INFLIGHT_CAP:      ${FARMER_INFLIGHT_CAP:-20}
      FARMER_FILE_CONCURRENCY:  ${FARMER_FILE_CONCURRENCY:-10}
      FARMER_FLUSH_INTERVAL_MS: ${FARMER_FLUSH_INTERVAL_MS:-100}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
