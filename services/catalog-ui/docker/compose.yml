# Catalog UI Service — a browser for what the catalog holds.
#
# It stores nothing, decides nothing and surveys nothing. Every answer it shows
# comes from the catalog's API or prospector's collector and is rendered unchanged, which makes it the
# cheapest way to find out that an endpoint cannot answer a question somebody
# actually has.
#
# It owns no storage. The page is served from the image, and everything else is
# a request forwarded to a service that does own something.
#
# The browser reaches the catalog and prospector's collector only through this
# service, which adds the token to every request it forwards, so the token
# never travels with the page. It checks nothing about who is asking, so
# whoever reaches this page acts with CATALOG_TOKEN: it can start and pause
# surveys and create, edit and delete lenses.

services:
  catalog-ui:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: catalog-ui

    container_name: catalog-ui

    environment:
      # Where the catalog answers. Inside the shared network that is the
      # catalog container by name. Prospector's collector is reached at
      # http://prospector:8080 by default, inside the module.
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}

      # The secret the catalog and prospector both check, added to every
      # request forwarded to them so the page never holds it — and so lent to
      # whoever reaches the page.
      #
      # Empty is allowed and means both are open — this then forwards without a
      # header, and nothing else changes.
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # The names the page may be opened as, comma-separated (a name matches
      # with or without its port). A forwarded request whose Host is none of
      # them is refused. Empty serves any Host.
      CATALOG_UI_HOSTS: ${CATALOG_UI_HOSTS:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    ports:
      # The page, on a known port: this is the service in the module a person
      # opens. Published on 127.0.0.1 unless CATALOG_UI_BIND names another
      # address.
      - "${CATALOG_UI_BIND:-127.0.0.1}:${CATALOG_UI_PORT:-9020}:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # The most memory the container may take, heap and native together: the
    # node heap (NODE_MEMORY_MB, 2048 MB) and a gigabyte beside it for buffers,
    # sockets and the runtime itself. Reaching it gets the container killed.
    mem_limit: ${CATALOG_UI_MEM_LIMIT:-3GiB}

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
