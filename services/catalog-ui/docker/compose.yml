# Catalog UI Service — a browser for what the catalog holds.
#
# It stores nothing, decides nothing and surveys nothing. Every answer it shows
# comes from the catalog's API or prospector's collector and is rendered unchanged, which makes it the
# cheapest way to find out that an endpoint cannot answer a question somebody
# actually has.
#
# It owns no storage. The page is served from the image, and everything else is
# a request forwarded to a service that does own something.
#
# The browser never reaches either service directly: prospector's collector is
# private to the module network, the catalog may run elsewhere, and the token
# would otherwise have to travel with the page.

services:
  catalog-ui:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: catalog-ui

    container_name: catalog-ui

    environment:
      # Where the catalog answers. Inside the shared network that is the
      # catalog container by name. Prospector's collector is always reached at
      # http://prospector:8080, inside the module.
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}

      # The secret the catalog and prospector both check, forwarded on their
      # behalf so the page never holds it.
      #
      # Empty is allowed and means both are open — this then forwards without a
      # header, and nothing else changes.
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live

    ports:
      # Health on whatever port docker picks, and the page on a known one — this
      # is the only service in the module meant to be opened by a person, so
      # unlike the catalog's own port it does not default to empty.
      - :3000
      - ${CATALOG_UI_PORT:-9020}:8080

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
