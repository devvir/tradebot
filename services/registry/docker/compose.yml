# Registry Service — persistent symbol and currency mappings
# Insert-only collections backed by MongoDB; JSON snapshots are bind-mounted
# from the repo so every new entry shows up in git diff.

services:
  registry:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: registry

    container_name: registry

    environment:
      DB_URL: ${DB_STORE_URL}
      REGISTRY_DATABASE: ${REGISTRY_DATABASE:-tradebot_registry}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - ${REGISTRY_PORT:-}:80
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ../data:/data/registry

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped
