# Pending Review
# Feed Service - Connects to BitMEX and publishes to queue
# Generic, reusable service. Can run multiple instances pointing to same queue.

services:
  feed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-.}-feed

    environment:
      # BitMEX Connection (testnet or live)
      BITMEX_TESTNET: ${BITMEX_TESTNET:-false}

      # Queue Connection (NOT coupled to rabbitmq service)
      RABBITMQ_URL: ${FEED_RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672}

      # Subscriptions
      FEED_CHANNELS: ${FEED_CHANNELS:-trade,orderBookL2_25}
      FEED_SYMBOLS: ${FEED_SYMBOLS:-XBTUSD}

      # Multi-instance coordination
      FEED_REPLICA_INDEX: ${FEED_REPLICA_INDEX:-0}
      FEED_REPLICA_COUNT: ${FEED_REPLICA_COUNT:-1}

      # Reconnect delays
      FEED_RECONNECT_DELAY_MS: ${FEED_RECONNECT_DELAY_MS:-5000}
      FEED_MAX_RECONNECT_DELAY_MS: ${FEED_MAX_RECONNECT_DELAY_MS:-60000}

      # Message TTL
      FEED_MESSAGE_TTL: ${FEED_MESSAGE_TTL:-1800000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-UTC}

    ports:
      - "${FEED_PORT:-3001}:3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: ${FEED_RESTART_POLICY:-unless-stopped}
