# Feed Service - Connects to BitMEX and publishes to queue
# Supports horizontal scaling via replicas configuration.

services:
  feed:
    container_name: ${MODULE_NAME:-tradebot}-feed
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: feed

    environment:
      # BitMEX Connection (testnet or live)
      BITMEX_TESTNET: ${BITMEX_TESTNET:-false}

      # Queue
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      FEED_MESSAGE_TTL: ${FEED_MESSAGE_TTL:-1800000}

      # Reconnect delays
      FEED_RECONNECT_DELAY_MS: ${FEED_RECONNECT_DELAY_MS:-5000}
      FEED_MAX_RECONNECT_DELAY_MS: ${FEED_MAX_RECONNECT_DELAY_MS:-60000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${FEED_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: ${FEED_RESTART_POLICY:-unless-stopped}

    depends_on:
      rabbitmq:
        condition: service_healthy

    deploy:
      replicas: ${FEED_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
