# Feed Service - Connects to BitMEX and publishes to queue
# Generic, reusable service. Multiple instances with different FEED_ROLE values.

services:
  feed:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "${FEED_PORT:-}:3000"

    environment:
      # BitMEX Connection (testnet or live)
      BITMEX_TESTNET: ${BITMEX_TESTNET:-false}

      # Queue Connection
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

      # Role-based channel/symbol selection
      FEED_ROLE: ${FEED_ROLE:-NONE}
      FEED_SYMBOLS: ${FEED_SYMBOLS:-}
      FEED_CHANNELS: ${FEED_CHANNELS:-}

      # Reconnect delays
      FEED_RECONNECT_DELAY_MS: ${FEED_RECONNECT_DELAY_MS:-5000}
      FEED_MAX_RECONNECT_DELAY_MS: ${FEED_MAX_RECONNECT_DELAY_MS:-60000}

      # Message TTL
      FEED_MESSAGE_TTL: ${FEED_MESSAGE_TTL:-1800000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: ${FEED_RESTART_POLICY:-unless-stopped}

    depends_on:
      - rabbitmq
