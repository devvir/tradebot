# Farmer Service — reads closed vault files, reconstructs WS envelopes, and inserts the data into MongoDB

services:
  farmer:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: farmer

    environment:
      DB_URL:      ${DB_URL}
      DB_DATABASE: ${DB_DATABASE:-tradebot}
      CACHE_URL:   ${CACHE_URL}
      CACHE_PASS:  ${CACHE_PASS}
      VAULT_URL:   ${VAULT_URL}
      WRITER_URL:  ${WRITER_URL:-http://writer}

      FARMER_TABLES:                ${FARMER_TABLES:-}
      FARMER_FILE_CONCURRENCY:      ${FARMER_FILE_CONCURRENCY:-10}
      FARMER_READ_BUFFER_HIGH:      ${FARMER_READ_BUFFER_HIGH:-1000000}
      FARMER_READ_BUFFER_LOW:       ${FARMER_READ_BUFFER_LOW:-500000}
      FARMER_INFLIGHT_CAP:          ${FARMER_INFLIGHT_CAP:-500000}
      FARMER_WIRE_CAP_MB:           ${FARMER_WIRE_CAP_MB:-20}
      FARMER_FLUSH_INTERVAL_MS:     ${FARMER_FLUSH_INTERVAL_MS:-100}
      FARMER_PROGRESS_INTERVAL_MS:  ${FARMER_PROGRESS_INTERVAL_MS:-1000}
      FARMER_METRICS_INTERVAL_MS:   ${FARMER_METRICS_INTERVAL_MS:-60000}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
