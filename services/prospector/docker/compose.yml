# Prospector Service — surveys venue archives and records what they publish.
#
# Owns its storage: CATALOG_DIR on the host (default: ${DATA_DIR}/catalog) is
# mounted at a fixed path in the container. Compose refuses to start it while
# neither variable is set. Pre-create it writable by uid 1000:
#   sudo mkdir -p /storage/tradebot/catalog && sudo chown 1000:1000 /storage/tradebot/catalog
#
# It downloads nothing — a survey moves kilobytes of XML while the archives it
# describes are terabytes.
#
# It surveys nothing unasked. A venue is enrolled by a request over its collector
# API, and from then on it is kept current across restarts: coming back
# up resumes an interrupted job from its scopes' cursors, waits out the rest
# of a venue's interval, and leaves paused and never-asked-for venues alone.
#
# So a deployment where nobody has ever started a survey is read-only, and stays
# that way however often it is restarted.

services:
  prospector:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: prospector

    container_name: prospector

    environment:
      # The shared secret every request must carry in `x-catalog-token`.
      #
      # Empty is allowed and means the check is off. The service warns loudly on
      # startup, so an open collector is a decision somebody took rather than one
      # nobody noticed.
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # The venues this process may survey or resume, comma-separated; empty
      # means every registered venue. It starts nothing on its own.
      PROSPECTOR_VENUES: ${PROSPECTOR_VENUES:-}

      # The ceiling on requests in flight at once, across every venue. What a
      # single venue tolerates is a fact about that venue and lives in its
      # adapter; this is the one number no adapter can see, since every one of
      # them can be reasonable while their sum is not. Venues draw from it first
      # come, first served — nothing is reserved, and a venue surveying alone is
      # limited by the lower of its own figure and this one. Keep below ~1,250
      # over HTTP/1.1; nothing enforces it.
      PROSPECTOR_CONCURRENCY: ${PROSPECTOR_CONCURRENCY:-200}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ${CATALOG_DIR:-${DATA_DIR:?DATA_DIR is not defined}/catalog}:/data/catalog

    # The API on 8080 is reached over the shared network only, and health on
    # 3000 from inside the container: no port is published.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Closing the catalog folds its write-ahead log into it, which is more than
    # the ten seconds a container is given by default.
    stop_grace_period: 30s

    # The most memory the container may take, heap and native together: the
    # node heap (NODE_MEMORY_MB, 2048 MB) and a gigabyte beside it for buffers,
    # sockets and the runtime itself. Reaching it gets the container killed.
    mem_limit: ${PROSPECTOR_MEM_LIMIT:-3GiB}

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
