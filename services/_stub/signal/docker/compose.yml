services:
  signal:
    build:
      context: ../..
      dockerfile: docker/dev.python.Dockerfile
      args:
        SERVICE_NAME: signal

    environment:
      WS_URL: ${WS_URL}
      REST_URL: ${REST_URL}
      QUEUE_URL: ${QUEUE_URL}

    volumes:
      - ../../services/signal:/live/services/signal
      - ../../packages:/live/packages

    ports:
      - :80

    restart: unless-stopped
