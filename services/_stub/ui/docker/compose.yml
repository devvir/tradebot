# UI Service - React SPA (Vite)

services:
  ui:
    build:
      context: ../../../..
      dockerfile: docker/dev.node.Dockerfile
      args:
        SERVICE_NAME: _stub/ui

    command: ["sh", "-c", "cd services/_stub/ui && pnpm install --ignore-scripts && pnpm dev"]

    ports:
      # Published on 127.0.0.1 unless UI_BIND names another address.
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-3000}:3000"

    volumes:
      - ../../../../:/live

    restart: unless-stopped
