# UI Service - React SPA (Vite)

services:
  ui:
    build:
      context: ../../../..
      dockerfile: docker/dev.node.Dockerfile
      args:
        SERVICE_NAME: _stub/ui

    command: ["sh", "-c", "cd services/_stub/ui && pnpm install --ignore-scripts && pnpm dev"]

    environment:
      # REST proxy target — required. The dev server forwards /api/v1/* here,
      # headers included (`x-testnet` among them).
      UI_REST_PROXY:  ${UI_REST_PROXY:-http://proxy}

      # Replay backend host — optional. When set, the dev server proxies
      # /replay, /replay-ws and /replay-control to it; when empty, the Replay
      # option in the env dropdown is greyed out.
      UI_DIGGER_HOST: ${UI_DIGGER_HOST:-}

    ports:
      - ${UI_PORT:-3000}:3000

    volumes:
      - ../../../../:/live

    restart: unless-stopped
