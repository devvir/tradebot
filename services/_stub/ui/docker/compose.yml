# UI Service - React SPA (Vite)
#
# A development service only: it runs the Vite dev server from the repository
# mounted at /live, so it always takes the dev fragment whatever APP_ENV says.

services:
  ui:
    extends:
      file: ../../../../docker/dev.node.compose.yml
      service: node

    build:
      context: ../../../..
      dockerfile: docker/dev.node.Dockerfile
      args:
        SERVICE_NAME: _stub/ui

    command: ["sh", "-c", "cd services/_stub/ui && pnpm install --ignore-scripts && pnpm dev"]

    ports:
      # Published on 127.0.0.1 unless UI_BIND names another address.
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-3000}:3000"

    # The most memory the container may take: the install and the Vite dev
    # server it runs, heap and native together, with the dev image's heap
    # (NODE_MEMORY_MB, 2048 MB) and a gigabyte beside it. Reaching it gets the
    # container killed.
    mem_limit: ${UI_MEM_LIMIT:-3GiB}

    restart: unless-stopped
