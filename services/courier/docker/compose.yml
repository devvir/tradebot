# Courier Service - Downloads BitMEX historical gzips from S3 and streams them to vault

services:
  courier:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: courier

    environment:
      # Dependencies
      VAULT_URL: ${VAULT_URL}

      # Config
      COURIER_START_DATE: ${COURIER_START_DATE:-}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
