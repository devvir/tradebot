# Trader Service — Trading bot orchestrator
#
# Connects to a BitMEX-compatible WS + REST endpoint and runs a strategy.
# The same image works against our own ws/rest services or BitMEX directly:
# only the URLs change. Every request is signed BitMEX-compatible (HMAC), and
# our proxy forwards pre-signed requests verbatim — there is no logical branch
# for "ours" vs "live" anywhere in the trader code.

services:
  trader:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: trader

    environment:
      # Endpoints — default to our own ws/rest services on the shared network.
      # Override in module .env to point at BitMEX directly.
      TRADER_WS_URL:   ${TRADER_WS_URL:-ws://ws}
      TRADER_REST_URL: ${TRADER_REST_URL:-http://rest}

      # BitMEX api credentials (signing happens in-process)
      TRADER_API_KEY:    ${TRADER_API_KEY}
      TRADER_API_SECRET: ${TRADER_API_SECRET}

      # Strategy
      TRADER_STRATEGY:         ${TRADER_STRATEGY:-range}
      TRADER_SYMBOL:           ${TRADER_SYMBOL:-XBTUSD}
      TRADER_TICK_INTERVAL_MS: ${TRADER_TICK_INTERVAL_MS:-30000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live

    ports:
      - :3000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped
