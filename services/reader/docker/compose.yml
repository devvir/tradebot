# Reader Service - MongoDB to RabbitMQ Replication
# Exports archived data from MongoDB and streams real-time changes to RabbitMQ

services:
  reader:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: reader

    environment:
      # Dependencies (queue and database)
      QUEUE_URL: ${QUEUE_URL}
      DB_URL: ${DB_URL}
      READER_DATABASE: ${READER_DATABASE:-}
      READER_MAX_READY: ${READER_MAX_READY:-100000}
      READER_COLLECTIONS: ${READER_COLLECTIONS:-}

      # Polling
      READER_POLL_INTERVAL_MS: ${READER_POLL_INTERVAL_MS:-3000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${READER_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: ${READER_RESTART_POLICY:-unless-stopped}
