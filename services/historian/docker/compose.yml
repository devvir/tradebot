# Historian Service - BitMEX REST API historical data fetcher

services:
  historian:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: historian

    environment:
      # Dependencies
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:root@mongodb:27017?authSource=admin}
      HISTORIAN_DATABASE: ${HISTORIAN_DATABASE:-tradebot_history}

      # BitMEX API
      BITMEX_TESTNET: ${BITMEX_TESTNET:-}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${HISTORIAN_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: ${HISTORIAN_RESTART_POLICY:-unless-stopped}
