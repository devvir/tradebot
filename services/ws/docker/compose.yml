# WS Service - BitMEX-compatible WebSocket server

services:
  ws:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: ws

    environment:
      QUEUE_URL: ${QUEUE_URL}
      SNAPSHOTS_URL: ${SNAPSHOTS_URL:-}
      BROADCAST_URL: ${BROADCAST_URL:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${WS_PORT:-}:80"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
