# Archivist Service - Consumes from queue and persists to MongoDB
# Generic, reusable service. Deduplicates and archives data.
# Supports horizontal scaling: Multiple instances automatically load-balance message consumption.

services:
  archivist:
    container_name: ${MODULE_NAME:-tradebot}-archivist
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: archivist

    environment:
      # Dependencies (queue and database)
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      MONGODB_URL: ${MONGODB_URL:-mongodb://root:root@mongodb:27017/tradebot?authSource=admin}

      # Batch Processing
      ARCHIVIST_BATCH_SIZE: ${ARCHIVIST_BATCH_SIZE:-1000}
      ARCHIVIST_BATCH_TIMEOUT_MS: ${ARCHIVIST_BATCH_TIMEOUT_MS:-5000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - "${ARCHIVIST_PORT:-}:3000"

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: ${ARCHIVIST_RESTART_POLICY:-unless-stopped}

    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    deploy:
      replicas: ${ARCHIVIST_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
