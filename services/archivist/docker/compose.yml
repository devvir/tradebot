# Pending Review
# Archivist Service - Consumes from queue and persists to MongoDB
# Generic, reusable service. Deduplicates and archives data.

services:
  archivist:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-.}-archivist

    environment:
      # Queue Connection - pass credentials separately for URL encoding
      RABBITMQ_URL: ${ARCHIVIST_RABBITMQ_URL:-}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}

      # Database Connection - pass credentials separately for URL encoding
      MONGODB_URL: ${ARCHIVIST_MONGODB_URL:-}
      MONGODB_USER: ${MONGODB_USER:-root}
      MONGODB_PASS: ${MONGODB_PASS:-password}
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-admin}
      MONGODB_DB: ${MONGODB_DB:-tradebot}

      # Batch Processing
      ARCHIVIST_BATCH_SIZE: ${ARCHIVIST_BATCH_SIZE:-100}
      ARCHIVIST_BATCH_TIMEOUT_MS: ${ARCHIVIST_BATCH_TIMEOUT_MS:-5000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-UTC}

    ports:
      - "${ARCHIVIST_PORT:-3110}:3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: ${ARCHIVIST_RESTART_POLICY:-unless-stopped}
