[project]
name = "signal"
version = "0.1.0"
description = "Technical indicator computation service"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.1",
    "aiohttp>=3.13.3",
    "pydantic-settings>=2.13.1",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
