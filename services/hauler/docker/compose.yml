# Hauler Service — brings catalogued venue files to disk under canonical names.
#
# The catalog serves every venue as a bucket; hauler walks each one — only what
# is still owed, through HAULER_LENS where one is set — fetches what it lists
# from the venue, and reports. It discovers nothing and serves only its health
# check.
#
# Files are written to DATA_ARCHIVES_DIR on the host, mounted at a fixed path in
# the container. Pre-create it writable by uid 1000:
#   sudo mkdir -p "$DATA_ARCHIVES_DIR" && sudo chown 1000:1000 "$DATA_ARCHIVES_DIR"

services:
  hauler:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: hauler

    container_name: hauler

    environment:
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # Which venues to haul (default: every venue the catalog knows)
      HAULER_VENUES:      ${HAULER_VENUES:-}

      # The catalog lens to haul through (default: none — every catalogued file)
      HAULER_LENS:        ${HAULER_LENS:-}

      # Fetches in flight across every venue together
      HAULER_CONCURRENCY: ${HAULER_CONCURRENCY:-100}

      # Free space on the archives' volume, in GB, below which no new file is
      # taken and the walk ends
      HAULER_MIN_FREE_GB: ${HAULER_MIN_FREE_GB:-25}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ${DATA_ARCHIVES_DIR:?DATA_ARCHIVES_DIR is not defined}:/data/archives

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # A stop is answered within half a minute, whatever is downloading. Files
    # still downloading after 15 s are given up and their partials removed. A
    # container killed before then leaves partials in .hauler-tmp, which the
    # next start removes. Either way the file stays owed.
    stop_grace_period: 30s

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
