# Hauler Service — brings catalogued venue files to disk under canonical names.
#
# The catalog serves one S3-style bucket, each venue under its own prefix;
# hauler walks each venue's prefix — only what is still owed, through
# HAULER_LENS where one is set — fetches what it lists from the venue, and
# reports. It discovers nothing and serves only its health
# check.
#
# Files are written to DATA_ARCHIVES_DIR on the host (default:
# ${DATA_DIR}/archives), mounted at a fixed path in the container. Compose
# refuses to start it while neither variable is set. Pre-create it writable by
# uid 1000:
#   dir="${DATA_ARCHIVES_DIR:-$DATA_DIR/archives}"
#   sudo mkdir -p "$dir" && sudo chown 1000:1000 "$dir"

services:
  hauler:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: hauler

    container_name: hauler

    environment:
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # Which venues to haul (default: every venue the catalog knows)
      HAULER_VENUES:      ${HAULER_VENUES:-}

      # The catalog lens to haul through (default: none — every catalogued file)
      HAULER_LENS:        ${HAULER_LENS:-}

      # Fetches in flight across every venue together: one budget, not one per
      # venue. A venue walking alone has all of it.
      HAULER_CONCURRENCY: ${HAULER_CONCURRENCY:-100}

      # Free space on the archives' volume, in GB, below which no new file is
      # taken and the walk ends
      HAULER_MIN_FREE_GB: ${HAULER_MIN_FREE_GB:-25}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ${DATA_ARCHIVES_DIR:-${DATA_DIR:?DATA_DIR is not defined}/archives}:/data/archives

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # A stop gives the files in flight 15 s; whatever is still downloading then
    # is given up, left owed, and its partial removed. The other 15 s are for
    # the last reports to reach the catalog. A container killed mid-download
    # leaves its partials in .hauler-tmp, which the next start deletes; the file
    # stays owed and is fetched again.
    stop_grace_period: 30s

    # The most memory the container may take, heap and native together: the
    # node heap (NODE_MEMORY_MB, 2048 MB) and a gigabyte beside it for buffers,
    # sockets and the runtime itself. Reaching it gets the container killed.
    mem_limit: ${HAULER_MEM_LIMIT:-3GiB}

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
