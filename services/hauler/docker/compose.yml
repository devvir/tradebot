# Hauler Service — brings catalogued venue files to disk under canonical names.
#
# Walks each venue the catalog serves as a bucket and writes to
# HAULER_ARCHIVES_DIR on the host, mounted at a fixed path in the container.
# Pre-create it writable by uid 1000:
#   sudo mkdir -p "$HAULER_ARCHIVES_DIR" && sudo chown 1000:1000 "$HAULER_ARCHIVES_DIR"
#
# It discovers nothing and serves nothing. Prospector establishes what every
# venue publishes; this fetches what the catalog lists — only what is still
# owed, through HAULER_LENS where one is set — so the two can run on different
# machines: the surveying where the link is good, the hauling where the disk is.

services:
  hauler:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: hauler

    container_name: hauler

    environment:
      CATALOG_API:   ${CATALOG_API:-http://catalog:8080}
      CATALOG_TOKEN: ${CATALOG_TOKEN:-}

      # Which venues to haul (default: every venue the catalog knows)
      HAULER_VENUES:      ${HAULER_VENUES:-}

      # The catalog lens to haul through (default: none — every catalogued file)
      HAULER_LENS:        ${HAULER_LENS:-}

      # Concurrent fetches per venue; venues never wait on each other
      HAULER_CONCURRENCY: ${HAULER_CONCURRENCY:-8}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ${HAULER_ARCHIVES_DIR:?HAULER_ARCHIVES_DIR is not defined}:/data/archives

    ports:
      - :3000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # A stop waits for the files in flight to finish and be reported. The
    # largest are binance's monthly trades, a few GB each, so this is room for
    # one at a slow link rather than docker's ten seconds. One that outlives it
    # leaves a .part, which the next start removes.
    stop_grace_period: 15m

    restart: unless-stopped
