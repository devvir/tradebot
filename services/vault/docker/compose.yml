# Vault Service — sole owner of raw dump file storage

services:
  vault:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: vault
        NODE_MEMORY_MB: 4096

    container_name: vault

    environment:
      VAULT_COMPRESSION_LEVEL: ${VAULT_COMPRESSION_LEVEL:-6}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV:  ${APP_ENV:-prod}
      TZ:        ${TZ:-UTC}

    ports:
      - ${VAULT_PORT:-}:8000
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live
      - ${VAULT_DATA_DIR:-/data/bitmex/vault}:/data/vault

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
