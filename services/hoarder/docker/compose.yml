# Hoarder Service - Connects to trading venues' market-data websockets and publishes to queue

services:
  hoarder:
    # APP_ENV (default prod) picks the image below and what the service mounts
    # for it: under dev, the repository root at /live, where the dev image runs
    # the host's own build; under prod, nothing, as the image carries the service.
    extends:
      file: ../../../docker/${APP_ENV:-prod}.node.compose.yml
      service: node

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: hoarder

    environment:
      # Which venues this instance collects: binance, bybit, kraken, okx
      # (default: all of them)
      HOARDER_VENUES: ${HOARDER_VENUES:-}

      # Queue
      QUEUE_URL: ${QUEUE_URL}

      # Durable queue buffering every published frame, and the most frames it
      # holds before the oldest are dropped
      HOARDER_QUEUE: ${HOARDER_QUEUE:-hoarder.raw}
      HOARDER_QUEUE_MAX_LENGTH: ${HOARDER_QUEUE_MAX_LENGTH:-1000000}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    user: "1000:1000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    # Rotated: at most five files of 50 MB each.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

    restart: unless-stopped
