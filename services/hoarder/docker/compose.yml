# Hoarder Service - Connects to trading venues' market-data websockets and publishes to queue

services:
  hoarder:
    scale: ${HOARDER_REPLICAS:-1}

    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: hoarder

    environment:
      # Which venues this instance collects: bitmex, binance, bybit, kraken, okx
      # (default: all of them)
      HOARDER_VENUES: ${HOARDER_VENUES:-}

      # Queue
      QUEUE_URL: ${QUEUE_URL}

      # Runtime
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - :3000

    user: "1000:1000"

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped
