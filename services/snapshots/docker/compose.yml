# Snapshots Service - Accumulates BitMEX deltas and publishes full table snapshots

services:
  snapshots:
    build:
      context: ../../..
      dockerfile: docker/${APP_ENV:-prod}.node.Dockerfile
      args:
        SERVICE_NAME: snapshots

    environment:
      BOUNCER_URL: ${BOUNCER_URL:-}
      BOUNCER_TOKEN: ${BOUNCER_TOKEN:-}

      QUEUE_URL: ${QUEUE_URL}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${APP_ENV:-prod}
      TZ: ${TZ:-UTC}

    ports:
      - ${SNAPSHOTS_HTTP_PORT:-}:3001
      - ${SNAPSHOTS_HEALTH_PORT:-}:3000

    user: 1000:1000

    volumes:
      - ../../../:/live

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: ${SNAPSHOTS_RESTART_POLICY:-unless-stopped}
