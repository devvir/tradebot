# Infra pack: local
#
# Defines, on the shared network ${PROJECT_NAME}-network:
#   cache      — Redis (services/redis/docker/compose.yml)

name: infrastructure

services:
  cache:
    extends:
      file: ../../../services/redis/docker/compose.yml
      service: redis
    hostname: cache
    container_name: cache
    ports:
      - "${CACHE_BIND:-127.0.0.1}:${CACHE_PORT:-}:6379"
    volumes:
      - cache-data:/data

volumes:
  cache-data:

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true

