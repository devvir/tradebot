# Infra pack: local
#
# Defines, on the shared network ${PROJECT_NAME}-network:
#   queue-rt   — RabbitMQ (services/rabbitmq/docker/base.yml)
#   cache      — Redis (services/redis/docker/compose.yml)
#
# `queue` is kept below, commented out: this pack runs no `queue`.

name: infrastructure

services:
  # queue:
  #   extends:
  #     file: ../../../services/rabbitmq/docker/base.yml
  #     service: rabbitmq
  #   hostname: queue
  #   container_name: queue
  #   ports:
  #     - "${QUEUE_BIND:-127.0.0.1}:${QUEUE_PORT:-}:5672"
  #     - "${QUEUE_MGMT_BIND:-127.0.0.1}:${QUEUE_MGMT_PORT:-}:15672"
  #   volumes:
  #     - queue-data:/var/lib/rabbitmq

  queue-rt:
    extends:
      file: ../../../services/rabbitmq/docker/base.yml
      service: rabbitmq
    hostname: queue-rt
    container_name: queue-rt
    ports:
      - "${QUEUE_RT_BIND:-127.0.0.1}:${QUEUE_RT_PORT:-}:5672"
      - "${QUEUE_RT_MGMT_BIND:-127.0.0.1}:${QUEUE_RT_MGMT_PORT:-}:15672"
    volumes:
      - queue-rt-data:/var/lib/rabbitmq

  cache:
    extends:
      file: ../../../services/redis/docker/compose.yml
      service: redis
    container_name: cache
    ports:
      - "${CACHE_BIND:-127.0.0.1}:${CACHE_PORT:-}:6379"
    volumes:
      - cache-data:/data

volumes:
  # queue-data:
  queue-rt-data:
  cache-data:

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true

