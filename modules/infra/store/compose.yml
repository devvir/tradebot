# Store Infra — Collecting Server
#
# Shared infrastructure for the data collection server.
#
# Abstract service names:
#   queue      — batch/general message broker (archeologist, packer pattern)
#   queue-rt   — real-time message broker (broadcast, archivist, collector)
#   db-feed    — MongoDB for real-time streaming data (archivist, collector)
#   db-store   — MongoDB for historical paginated data (archeologist)
#   bouncer    — API credential signing

include:
  - path: ../../../services/bouncer/docker/compose.yml
  - path: ../../../services/registry/docker/compose.yml

services:
  queue:
    extends:
      file: ../../../services/rabbitmq/docker/base.yml
      service: rabbitmq
    hostname: queue
    container_name: queue
    ports:
      - "${QUEUE_PORT:-}:5672"
      - "${QUEUE_MGMT_PORT:-}:15672"
    volumes:
      - queue-data:/var/lib/rabbitmq

  queue-rt:
    extends:
      file: ../../../services/rabbitmq/docker/base.yml
      service: rabbitmq
    hostname: queue-rt
    container_name: queue-rt
    ports:
      - "${QUEUE_RT_PORT:-}:5672"
      - "${QUEUE_RT_MGMT_PORT:-}:15672"
    volumes:
      - queue-rt-data:/var/lib/rabbitmq

  db-feed:
    extends:
      file: ../../../services/mongodb/docker/base.yml
      service: mongodb
    container_name: db-feed
    command: mongod --quiet --setParameter logLevel=0 --wiredTigerCacheSizeGB=${DB_FEED_CACHE_SIZE_GB:-2}
    ports:
      - "${DB_FEED_PORT:-}:27017"
    volumes:
      - db-feed-data:/data/db
      - db-feed-config:/data/configdb

  db-store:
    extends:
      file: ../../../services/mongodb/docker/base.yml
      service: mongodb
    container_name: db-store
    command: mongod --quiet --setParameter logLevel=0 --wiredTigerCacheSizeGB=${DB_STORE_CACHE_SIZE_GB:-2}
    ports:
      - "${DB_STORE_PORT:-}:27017"
    volumes:
      - db-store-data:/data/db
      - db-store-config:/data/configdb

volumes:
  queue-data:
  queue-rt-data:
  db-feed-data:
  db-feed-config:
  db-store-data:
  db-store-config:

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true

