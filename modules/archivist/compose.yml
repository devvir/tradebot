# Archivist Module
# Includes: extended broadcast (bitmex ws consumer + rabbitmq)
#           router (1) (broadcast → codec exchange)
#           codec (bitmex messages transformer)
#           router (2) (codec → writer exchange)
#           extended writer (mongodb manager + rabbitmq + mongodb)
#
# Data flow:
#   Broadcast → topic:broadcast (routingKey = message.table, e.g. "message.trade")
#   Router    → consumes from topic:broadcast, replaces "message" with "compress" in the
#               routingKey (e.g. "compress.trade"), and republishes to topic:codec.in
#   Codec     → consumes from codec.in, compresses the message, and republishes to codec.out
#   Router    → consumes from topic:codec.out, replaces "compress" with "archive" in the
#               routingKey (e.g. "archive.trade"), and republishes to topic:writer
#   Writer    → consumes from its writer.archive queue, and stores the message in MongoDB

include:
  - path: ../../services/broadcast/docker/extended.yml
  - path: ../../services/writer/docker/extended.yml
  - path: ../../services/codec/docker/compose.yml

services:
  archive-in:
    extends:
      file: ../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_RULES: "archive.in@topic:broadcast > @topic:codec.in(key:message:compress)"

  archive-out:
    extends:
      file: ../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_RULES: "archive.out@topic:codec.out > @topic:writer(key:compress:archive)"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
