# Live Module — Exchange App
#
# Infra: bouncer (from infra/local)
#
# Bots and the UI connect to live (or testnet) BitMEX directly:
#   - WebSocket: clients open a connection to BitMEX themselves
#   - REST:      clients go through `proxy`, which signs via Bouncer and
#                forwards transparently to live or testnet
#
# Per-request environment selection is driven by the `x-testnet` header on
# proxy calls (and by the BitMEX URL the client picks for WS).

# Docker Compose Project (for all exchange app modules)
name: exchange

include:
  - path: ../../../services/proxy/docker/compose.yml

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
