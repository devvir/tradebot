# Live Module — Exchange App
#
# Infra: queue-rt, bouncer, redis
#
# Wires live BitMEX data into a fully BitMEX-compatible API surface.
# Bots connect to ws and rest as if they were BitMEX.
#
# Data flow:
#
#   BitMEX WS ──► broadcast ──► [broadcast exchange] ──► ws.deltas@default ──► ws ◄── bots
#
#   bots ──► rest ──► proxy ──► BitMEX REST API
#                └── (auth via Bouncer)

# Docker Compose Project (for all exchange app modules)
name: exchange

include:
  - path: ../../../services/ws/docker/compose.yml
  - path: ../../../services/rest/docker/compose.yml
  - path: ../../../services/proxy/docker/compose.yml

services:
  feed:
    extends:
      file: ../../../services/broadcast/docker/compose.yml
      service: broadcast

    depends_on:
      live-pipe:
        condition: service_completed_successfully

  live-pipe:
    extends:
      file: ../../../services/pipe/docker/compose.yml
      service: pipe

    environment:
      PIPE_BINDINGS: topic:broadcast > ws.deltas@topic:deltas

  # trader:
  #   extends:
  #     file: ../../../services/trader/docker/compose.yml
  #     service: trader

  #   environment:
  #     TRADER_WS_URL:   ${TRADER_WS_URL:-ws://ws}
