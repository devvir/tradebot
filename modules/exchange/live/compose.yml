# Live Module — Exchange App
#
# Infra: queue-rt, bouncer, redis
#
# Wires live BitMEX data into a fully BitMEX-compatible API surface.
# Bots connect to ws and rest as if they were BitMEX.
#
# Data flow:
#
#   BitMEX WS ──► broadcast ──► [broadcast exchange]
#                                             │
#                    ┌────────────────────────┤
#           snapshots@default        ws.deltas@default
#                    │                        │
#                snapshots ◄── HTTP ──────── ws  ◄── bots
#
#   bots ──► rest ──► proxy ──► BitMEX REST API
#                └── (auth via Bouncer)

# Docker Compose Project (for all exchange app modules)
name: exchange

include:
  - path: ../../../services/ws/docker/compose.yml
  - path: ../../../services/rest/docker/compose.yml
  - path: ../../../services/proxy/docker/compose.yml
  - path: ../../../services/snapshots/docker/compose.yml

services:
  broadcast:
    extends:
      file: ../../../services/broadcast/docker/compose.yml
      service: broadcast

    depends_on:
      live-router:
        condition: service_healthy

  live-router:
    extends:
      file: ../../../services/router/docker/compose.yml
      service: router

    environment:
      ROUTER_RULES: >-
        | live@topic:broadcast > ws.deltas & snapshots

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
