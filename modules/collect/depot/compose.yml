# Depot Module
#
# Infra: registry
#
# Continuously downloads the complete BitMEX historical dataset and keeps it
# up to date as new data becomes available:
#
#   courier → S3 gzip dumps (trade, quote)                   → vault
#   scribe  → REST endpoints                                  → vault
#   tardy   → Tardis first-of-month WS history (7 WS tables) → vault
#   hauler  → other venues' published archives                → host disk (not vault)
#
# Hauler downloads from the catalog the `catalog` module builds, so that module
# has to have surveyed a venue before there is anything here to fetch — and it
# fetches only what is on its shopping list, which is empty until somebody adds
# to it over its API.

# Docker Compose Project
name: collect

include:
  - path: ../../../services/courier/docker/compose.yml
  - path: ../../../services/scribe/docker/compose.yml
  - path: ../../../services/hauler/docker/compose.yml

  # Tardis data will not be collected unless needed, from Aug 1st 2026 onward.
  # - path: ../../../services/tardy/docker/compose.yml

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
