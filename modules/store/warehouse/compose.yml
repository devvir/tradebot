# Warehouse Module
#
# Infra: none of its own — stocker reads the catalog, which the archives module
# runs, over the shared network.
#
# Turns the archives into the Parquet vault:
#
#   archives (read-only) → stocker → Parquet vault, one directory per partition
#
# The archives are hauler's and are mounted read-only here: this module only
# reads them, and the mount enforces that rather than trusting the code.

# Docker Compose Project
name: store

include:
  - path: ../../../services/stocker/docker/compose.yml

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
