# Extract Module
# Includes: rabbitmq (queue), mongodb (storage), unarchivist (MongoDB -> RabbitMQ replication)

include:
  - path: ../../services/rabbitmq/docker/compose.yml
  - path: ../../services/mongodb/docker/compose.yml
  - path: ../../services/codec/docker/compose.yml
  - path: ../../services/archivist/docker/compose.yml
  - path: ../../services/unarchivist/docker/compose.yml

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
