# Customs Module
#
# Infra: db-store, queue
#
# Data flow:
#   clerk         → reads closed vault CSV.gz files
#                 → WS tables:   topic:clerk (routingKey = message)
#                 → REST tables: topic:clerk (routingKey = record)
#
#   customs-pipe  → binds topic:clerk(key:message) → fanout:assembler
#                 → binds topic:clerk(key:record)  → fanout:registrar
#                 → binds topic:assembled          → fanout:registrar
#
#   assembler     → consumes from fanout:assembler
#                 → assembles typed BitmexMessage from raw CSV rows
#                 → topic:assembled
#
#   registrar     → consumes record / message
#                 → assigns deterministic _id (date_offset * 2^39 + msg_index * 2^12)
#                 → bulk-inserts to MongoDB tradebot / collection = table name
#
# ID layout: [ date: 14 bits ][ msg_index: 27 bits ][ reserved: 12 bits ]
#   = 53-bit safe integer; max = Number.MAX_SAFE_INTEGER

# Docker Compose Project
name: transform

include:
  - path: ../../../services/assembler/docker/compose.yml
  - path: ../../../services/distiller/docker/compose.yml
  - path: ../../../services/registrar/docker/compose.yml

services:
  clerk:
    extends:
      file: ../../../services/clerk/docker/compose.yml
      service: clerk
    depends_on:
      customs-pipe:
        condition: service_completed_successfully

  customs-pipe:
    extends:
      file: ../../../services/pipe/docker/compose.yml
      service: pipe
    environment:
      PIPE_BINDINGS: >-
        | topic:clerk(key:message) > fanout:assembler
        | topic:clerk(key:record)  > fanout:registrar
        | topic:assembled          > fanout:registrar

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
