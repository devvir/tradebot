# Collector Module
# Includes: rabbitmq (queue), mongodb (storage), feed (bitmex ws consumer), writer (data archiver)

include:
  - path: ../../services/rabbitmq/docker/compose.yml
  - path: ../../services/mongodb/docker/compose.yml

services:
  collector-feed:
    extends:
      file: ../../services/feed/docker/compose.yml
      service: feed
    depends_on:
      rabbitmq:
        condition: service_healthy

  collector-writer:
    extends:
      file: ../../services/writer/docker/compose.yml
      service: writer
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
