# Collector Module
# Includes: extended broadcast (bitmex ws consumer + rabbitmq)
#           router (broadcast → writer exchange)
#           extended writer (mongodb manager + rabbitmq + mongodb)
#
# Data flow:
#   Broadcast → topic:broadcast (routingKey = message.table, e.g. "message.trade")
#   Router    → consumes from topic:broadcast, replaces "message" with "collect" in the
#               routingKey (e.g. "collect.trade"), and republishes to topic:writer
#   Writer    → consumes from writer.collect queue, and stores the message in MongoDB

include:
  - path: ../../services/broadcast/docker/extended.yml
  - path: ../../services/writer/docker/extended.yml

services:
  collector:
    extends:
      file: ../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_RULES: "collector@topic:broadcast > @topic:writer(key:message:collect)"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
