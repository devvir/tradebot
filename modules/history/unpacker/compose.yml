# Unpacker Module
#
# Infra: queue, db-store
#
# Data flow:
#   Reader     → queue:reader.<database>  (reader asserts its own durable queue via default exchange)
#   unpack-in  → topic:codec.in           (consumes queue:reader.<database>, injects headers)
#   codec      → topic:codec.out          (decodes and decompresses)
#   unpack-out → topic:writer             (native E2E binding, no transformation)
#   writer     → MongoDB tradebot_unpacked
#
# unpack-in (router):
#   Consumes from queue:reader.<database> (asserted by the reader service).
#   Injects x-codec-strategy=decode and x-writer-database=tradebot_unpacked headers,
#   and publishes to codec.in topic exchange.
#
# codec:
#   Decodes and decompresses messages, republishes to codec.out.
#
# unpack-out (pipe):
#   Wires codec.out topic exchange → writer topic exchange (native E2E binding).
#
# writer:
#   Consumes from writer queue, stores to database specified by x-writer-database header.

# Docker Compose Project (for history app transformation modules)
name: packing

include:
  - path: ../../../services/reader/docker/compose.yml
  - path: ../../../services/codec/docker/compose.yml
  - path: ../../../services/writer/docker/compose.yml

services:
  unpack-in:
    extends:
      file: ../../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_MAX_READY: ${ROUTER_MAX_READY:-100000}
      ROUTER_WATCH_QUEUES: codec,writer

      ROUTER_RULES: >-
        reader.${READER_DATABASE} > @topic:codec.in(
          header:x-codec-strategy=decode,
          header:x-writer-database=tradebot_unpacked
        )

  unpack-out:
    extends:
      file: ../../../services/pipe/docker/compose.yml
      service: pipe
    environment:
      PIPE_BINDINGS: "topic:codec.out > topic:writer"

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
