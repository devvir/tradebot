# Collector Module
#
# Infra: queue-rt, db-feed
#
# Data flow:
#   Broadcast → topic:broadcast  (routingKey = table.action.symbol)
#   collect   → topic:writer     (injects x-writer-database=tradebot_collect)
#   writer    → MongoDB tradebot_collect
#
# collect (router):
#   Consumes all messages from broadcast topic exchange,
#   injects x-writer-database=tradebot_collect header,
#   and publishes to writer topic exchange.
#
# writer:
#   Consumes from writer queue, stores to database specified by x-writer-database header.

# Docker Compose Project (for all history app modules)
name: history

include:
  - path: ../../../services/writer/docker/compose.yml

services:
  broadcast:
    extends:
      file: ../../../services/broadcast/docker/compose.yml
      service: broadcast

    depends_on:
      collect:
        condition: service_healthy

  collect:
    extends:
      file: ../../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_RULES: >-
        collect@topic:broadcast > @topic:writer(
          header:x-writer-database=tradebot_collect
        )

networks:
  default:
    name: ${PROJECT_NAME:-tradebot}-network
    external: true
