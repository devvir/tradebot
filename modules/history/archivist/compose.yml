# Archivist Module
#
# Data flow:
#   Broadcast   → topic:broadcast  (routingKey = table.action.symbol)
#   archive-in  → topic:codec.in   (injects x-codec-strategy=encode, x-writer-database=tradebot_archive)
#   codec       → topic:codec.out  (encodes and compresses)
#   archive-out → topic:writer     (native E2E binding, no transformation)
#   writer      → MongoDB tradebot_archive
#
# archive-in (router):
#   Consumes all messages from broadcast topic exchange,
#   injects x-codec-strategy=encode and x-writer-database=tradebot_archive headers,
#   and publishes to codec.in topic exchange.
#
# codec:
#   Encodes and compresses messages, republishes to codec.out.
#
# archive-out (pipe):
#   Wires codec.out topic exchange → writer topic exchange (native E2E binding).
#
# writer:
#   Consumes from writer queue, stores to database specified by x-writer-database header.

include:
  - path: ../../../services/broadcast/docker/extended.yml
  - path: ../../../services/writer/docker/extended.yml
  - path: ../../../services/codec/docker/compose.yml

services:
  archive-in:
    extends:
      file: ../../../services/router/docker/compose.yml
      service: router

    environment:
      ROUTER_RULES: >-
        archive.in@topic:broadcast > @topic:codec.in(
          header:x-codec-strategy=encode,
          header:x-writer-database=tradebot_archive
        )

  archive-out:
    extends:
      file: ../../../services/pipe/docker/compose.yml
      service: pipe

    environment:
      PIPE_BINDINGS: "topic:codec.out > topic:writer"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
