# Packer Module
#
# Data flow:
#   Reader   → queue:reader.<database>  (reader asserts its own durable queue via default exchange)
#   pack-in  → topic:codec.in           (consumes queue:reader.<database>, injects headers)
#   codec    → topic:codec.out          (encodes and compresses)
#   pack-out → topic:writer             (native E2E binding, no transformation)
#   writer   → MongoDB tradebot_packed
#
# pack-in (router):
#   Consumes from queue:reader.<database> (asserted by the reader service).
#   Injects x-codec-strategy=encode and x-writer-database=tradebot_packed headers,
#   and publishes to codec.in topic exchange.
#
# codec:
#   Encodes and compresses messages, republishes to codec.out.
#
# pack-out (pipe):
#   Wires codec.out topic exchange → writer topic exchange (native E2E binding).
#
# writer:
#   Consumes from writer queue, stores to database specified by x-writer-database header.

include:
  - path: ../../../services/writer/docker/extended.yml
  - path: ../../../services/codec/docker/compose.yml

services:
  packer:
    extends:
      file: ../../../services/reader/docker/compose.yml
      service: reader

  pack:
    extends:
      file: ../../../services/router/docker/compose.yml
      service: router
    environment:
      ROUTER_RULES: >-
        reader.${READER_DATABASE} > @topic:codec.in(
          header:x-codec-strategy=encode,
          header:x-writer-database=tradebot_packed
        )

  pack-out:
    extends:
      file: ../../../services/pipe/docker/compose.yml
      service: pipe
    environment:
      PIPE_BINDINGS: "topic:codec.out > topic:writer"

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tradebot}-network
    external: true
